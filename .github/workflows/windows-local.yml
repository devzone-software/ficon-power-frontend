name: FICON Power Windows

on:
  workflow_dispatch:
  push:
    branches: [feature/autonomous-windows]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/build-windows-local.ps1'
      - '.github/workflows/windows-local.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Compilar y verificar aplicación autónoma
        shell: pwsh
        run: ./scripts/build-windows-local.ps1

      - name: Guardar paquete Windows
        uses: actions/upload-artifact@v4
        with:
          name: FiconPower-Windows-x64
          path: dist/windows/FiconPower-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
