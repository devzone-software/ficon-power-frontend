name: FICON Power Windows
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL del backend/proxy FICON
        required: true
        default: http://179.197.74.30:3000
        type: string
  push:
    branches: [feature/windows-desktop]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Compilar y verificar
        shell: pwsh
        env:
          FICON_API_URL: ${{ inputs.api_base_url || 'http://179.197.74.30:3000' }}
        run: ./scripts/windows/build.ps1 -ApiBaseUrl $env:FICON_API_URL
      - name: Publicar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: FiconPower-Windows-x64
          path: dist/windows/FiconPower-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
